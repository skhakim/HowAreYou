version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m backend.run
    env_file: .env
    environment:
      # Inside compose the database host is the `db` service.
      DATABASE_URL: postgresql://postgres:postgres@db/mhst
    ports:
      - 8001:5000
    depends_on:
      - db

  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mhst
    ports:
      - '5433:5432'
    volumes:
      - ./postgres:/var/lib/postgresql/data
      # Loaded only when the data directory is empty (first start).
      - ./db/backup.sql:/docker-entrypoint-initdb.d/backup.sql
